<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Availability Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #F2F5F1;
      color: #11261E;
      font-family: 'Figtree', system-ui, sans-serif;
    }

    /* Header band */
    .hero { background: #0F3D2E; color: #FFFFFF; }
    .hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 48px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .hero h1 { margin: 0 0 6px; font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
    .hero p { margin: 0; font-size: 15px; color: #BFE3CF; }
    .summary { min-width: 260px; display: flex; flex-direction: column; gap: 10px; }
    .summary-text { display: flex; align-items: baseline; gap: 8px; }
    .summary-text strong { font-size: 34px; font-weight: 800; }
    .summary-text span { font-size: 16px; color: #BFE3CF; }
    .bar { height: 8px; border-radius: 4px; background: #2A5A49; }
    .bar-fill { height: 8px; border-radius: 4px; background: #7EE0A8; width: 0; transition: width 0.3s; }

    /* Main */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 48px 56px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; }
    .filter-btn {
      height: 44px;
      padding: 0 18px;
      border-radius: 22px;
      border: 1px solid #B8C2BB;
      background: transparent;
      color: #11261E;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .filter-btn:hover { background: #E4EAE5; }
    .filter-btn.active { background: #0F3D2E; border-color: #0F3D2E; color: #FFFFFF; }
    .filter-btn:focus-visible, .switch:focus-visible { outline: 3px solid #0F3D2E; outline-offset: 2px; }
    .endpoint {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      color: #3E4A44;
      background: #E0E7E1;
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card {
      background: #FFFFFF;
      border: 1px solid #DCE2DD;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .card.off { background: #F7F8F6; }
    .avatar {
      width: 52px;
      height: 52px;
      flex: none;
      border-radius: 50%;
      background: #CFEBDA;
      color: #0B3B26;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
    }
    .card.off .avatar { background: #E3E7E4; color: #44504A; }
    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .info h3 { margin: 0; font-size: 17px; font-weight: 700; }
    .info .role { font-size: 14px; color: #4F5A54; }
    .status { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 14px; font-weight: 700; color: #0B6B3F; }
    .card.off .status { color: #4F5A54; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #0F7B4A; border: 2px solid #0F7B4A; }
    .card.off .dot { background: transparent; border-color: #7C8680; }

    /* Switch */
    .switch {
      width: 52px;
      height: 30px;
      flex: none;
      position: relative;
      border: 0;
      border-radius: 15px;
      background: #7C8680;
      padding: 0;
      cursor: pointer;
      transition: background 0.2s;
    }
    .switch[aria-checked="true"] { background: #0F7B4A; }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FFFFFF;
      transition: transform 0.2s;
    }
    .switch[aria-checked="true"]::after { transform: translateX(20px); }

    .empty {
      grid-column: 1 / -1;
      background: #FFFFFF;
      border: 1px solid #DCE2DD;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      font-size: 15px;
      color: #4F5A54;
    }

    /* Toast */
    .toast {
      position: fixed;
      right: 32px;
      bottom: 32px;
      max-width: calc(100% - 64px);
      background: #11261E;
      color: #FFFFFF;
      padding: 14px 18px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast .msg { font-size: 15px; font-weight: 700; }
    .toast .detail { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #BFE3CF; }

    @media (max-width: 600px) {
      .hero-inner, .main { padding-left: 20px; padding-right: 20px; }
      .hero h1 { font-size: 26px; }
      .toast { right: 16px; bottom: 16px; max-width: calc(100% - 32px); }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div>
        <h1>Team Availability</h1>
        <p>Flip a switch to update someone&rsquo;s status. Changes are saved instantly.</p>
      </div>
      <div class="summary">
        <div class="summary-text">
          <strong id="availableNum">0</strong>
          <span id="totalText">of 0 available</span>
        </div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="toolbar">
      <div class="tabs">
        <button type="button" class="filter-btn active" id="filter-all" data-filter="all">All &middot; <span id="count-all">0</span></button>
        <button type="button" class="filter-btn" id="filter-available" data-filter="available">Available &middot; <span id="count-available">0</span></button>
        <button type="button" class="filter-btn" id="filter-unavailable" data-filter="unavailable">Unavailable &middot; <span id="count-unavailable">0</span></button>
      </div>
    </div>

    <div id="usersGrid" class="grid"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <div class="msg" id="toastMsg">Status updated</div>
    <div class="detail" id="toastDetail"></div>
  </div>

  <script>
    let usersData = [];
    let currentFilter = 'all';
    let toastTimer;

    const usersGrid = document.getElementById('usersGrid');
    const countAll = document.getElementById('count-all');
    const countAvailable = document.getElementById('count-available');
    const countUnavailable = document.getElementById('count-unavailable');
    const availableNum = document.getElementById('availableNum');
    const totalText = document.getElementById('totalText');
    const barFill = document.getElementById('barFill');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const toastDetail = document.getElementById('toastDetail');

    // Initials are built from the name, so the API does not need to send them
    function getInitials(name) {
      return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
    }

    async function fetchUsers() {
      try {
        const response = await fetch('/api/users');
        if (!response.ok) throw new Error('Request failed');
        usersData = await response.json();
        render();
      } catch (err) {
        console.error('Error fetching users:', err);
        usersGrid.innerHTML = '<div class="empty">Could not load the team. Please refresh the page.</div>';
      }
    }

    function render() {
      // Stats
      const total = usersData.length;
      const available = usersData.filter(u => u.is_available).length;

      countAll.textContent = total;
      countAvailable.textContent = available;
      countUnavailable.textContent = total - available;
      availableNum.textContent = available;
      totalText.textContent = `of ${total} available`;
      barFill.style.width = total ? `${Math.round((available / total) * 100)}%` : '0%';

      // Filter
      const filtered = usersData.filter(user => {
        if (currentFilter === 'available') return user.is_available;
        if (currentFilter === 'unavailable') return !user.is_available;
        return true;
      });

      usersGrid.innerHTML = '';

      if (filtered.length === 0) {
        usersGrid.innerHTML = '<div class="empty">No team members match the selected filter.</div>';
        return;
      }

      filtered.forEach(user => {
        const on = user.is_available;
        const name = escapeHtml(user.name);
        const card = document.createElement('div');
        card.className = 'card' + (on ? '' : ' off');

        card.innerHTML = `
          <div class="avatar">${escapeHtml(getInitials(user.name))}</div>
          <div class="info">
            <h3>${name}</h3>
            <div class="role">${escapeHtml(user.role)}</div>
            <div class="status"><span class="dot"></span>${on ? 'Available' : 'Unavailable'}</div>
          </div>
          <button
            type="button"
            class="switch"
            role="switch"
            aria-checked="${on}"
            aria-label="Availability for ${name}"
            data-id="${user.id}"
          ></button>
        `;

        usersGrid.appendChild(card);
      });
    }

    async function toggleAvailability(id) {
      const user = usersData.find(u => u.id === id);
      if (!user) return;
      const newStatus = !user.is_available;

      try {
        const response = await fetch(`/api/users/${id}/availability`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_available: newStatus })
        });
        if (!response.ok) throw new Error('Update failed');

        const updatedUser = await response.json();
        const index = usersData.findIndex(u => u.id === id);
        if (index !== -1) usersData[index] = updatedUser;

        render();
        showToast(
          `${updatedUser.name} is now ${updatedUser.is_available ? 'available' : 'unavailable'}`
        );
      } catch (err) {
        console.error('Error updating availability:', err);
        showToast('Could not save the change', 'Please try again');
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    function showToast(message, detail) {
      toastMsg.textContent = message;
      toastDetail.textContent = detail || '';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners (no inline onclick)
    document.querySelector('.tabs').addEventListener('click', (event) => {
      const btn = event.target.closest('.filter-btn');
      if (btn) setFilter(btn.dataset.filter);
    });

    usersGrid.addEventListener('click', (event) => {
      const btn = event.target.closest('.switch');
      if (btn) toggleAvailability(Number(btn.dataset.id));
    });

    fetchUsers();
  </script>
</body>
</html>
